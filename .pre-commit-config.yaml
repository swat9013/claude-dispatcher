# `pre-commit install` 1 回で commit 時 (gitleaks / gofmt / go mod tidy / actionlint / 設定の一致 / 図の検査) と push 前 (gitleaks の commit 範囲 / go vet / golangci-lint / go test) の両方の hook が入る。
# CI (.github/workflows/checks.yml) は commit 時の hook を `pre-commit run --all-files` で撃つので、手元と同じ検査が CI でも落ちる (repocheck-adr を除く。理由は repocheck-adr の hook のコメント)
default_install_hook_types: [pre-commit, pre-push]
# stages を書かない hook は commit 時だけに撃つ (書かないと install した全 stage で撃たれ、push 前にも走る)
default_stages: [pre-commit]
# 手元の Go を使う hook の `language: unsupported` は 4.4.0 で入った名前 (それより古い pre-commit は解釈できずに落ちる)
minimum_pre_commit_version: '4.4.0'

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      # push する commit を 1 つずつ検査する。範囲は pre-commit が PRE_COMMIT_FROM_REF / PRE_COMMIT_TO_REF で渡す
      # (push 前は remote に無い commit、CI は PR の base / head を --from-ref / --to-ref で渡す)。
      # merge commit は git log -p が差分を出さないので --no-merges で外す
      - id: gitleaks
        name: gitleaks (push する commit)
        entry: sh -c 'gitleaks git --redact --log-opts="--no-merges $PRE_COMMIT_FROM_REF..$PRE_COMMIT_TO_REF"'
        always_run: true
        stages: [pre-push]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # actionlint は PATH の shellcheck で run: の script も検査する。hook 環境に版を固定した shellcheck を入れ、
        # 手元の有無と CI の runner に入っている版に結果を左右させない
        additional_dependencies: [github.com/wasilibs/go-shellcheck/cmd/shellcheck@v0.11.1]
  # Go の hook は go コマンド経由で撃つ。go.mod の toolchain directive の版の Go が動き、手元と CI で版が揃う
  # (`language: golang` は pre-commit が専用の GOROOT と GOTOOLCHAIN=local を立てるので toolchain directive が効かない)
  - repo: local
    hooks:
      # go fmt は整形し直した file を書き換える。書き換えがあると pre-commit が hook を落とす
      - id: gofmt
        name: gofmt
        entry: go fmt ./...
        language: unsupported
        pass_filenames: false
        types: [go]
      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy -diff
        language: unsupported
        pass_filenames: false
        files: (\.go|^go\.mod|^go\.sum)$
      # golangci-lint の既定セットも govet を含むが、go vet も撃つ。go vet は go.mod の toolchain の Go に入っている
      # analyzer で動き、golangci-lint の govet は golangci-lint を build したときの analyzer で動くので、
      # Go の新しい版で足された analyzer は go vet にしか無いことがある
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # 同じ値を 2 箇所以上に書いている設定 (GoReleaser の版、check 名の列挙、go.mod の `go` 行と CONTRIBUTING.md の期待値) の
      # 一致を検査する。network は使わず軽いので、読む file を files: に重ねて書かずに毎回撃つ
      - id: repocheck
        name: repocheck (設定の一致)
        entry: go run ./scripts/repocheck files
        language: unsupported
        pass_filenames: false
        always_run: true
      # ADR の番号の一意。手元の branch の中の重なりは CL の作者が直せるので commit 時に撃つ。
      # CI の pre-commit job は SKIP で外す (merge の後の main 側の重なりで、無関係な PR の merge ref まで赤くするため)。
      # main 側の重なりは .github/workflows/adr-numbers.yml が拾って issue にする
      - id: repocheck-adr
        name: repocheck (ADR の番号の一意)
        entry: go run ./scripts/repocheck adr
        language: unsupported
        pass_filenames: false
        always_run: true
      # ADR の file 名の形。名前は CL の中だけで決まり作者が直せるので、CI の pre-commit job でも撃つ (repocheck-adr と hook を分ける理由)。
      # 渡すのは git に載った file だけ (commit 時は staged の file、--all-files は tracked の file) なので、git に載っていない lock file では落ちない
      - id: repocheck-adr-names
        name: repocheck (ADR の file 名の形)
        entry: go run ./scripts/repocheck adr-names
        language: unsupported
        pass_filenames: true
        files: ^docs/adr/[^/]+$
        # 既定の types: [file] は symlink を渡さない (types と types_or は AND で効く)。types を空にして symlink の ADR も渡す
        types: []
        types_or: [file, symlink]
      # docs/design の図。描画の版は scripts/plantuml.version に固定する。svg の一致の比べ方とその理由は CONTRIBUTING.md の「gate」。
      # plantuml と python3 を撃つ 2 つは、図と無関係な commit を前提 tool の有無で止めないよう、読む file と自身の script に絞る。
      # repocheck-diagrams は network も外部 tool も使わないので、隣の repocheck と同じく毎回撃つ
      - id: plantuml-syntax
        name: plantuml (構文)
        entry: scripts/plantuml-check.sh
        language: unsupported
        pass_filenames: false
        files: ^(docs/design/[^/]*\.puml|scripts/plantuml\.version|scripts/plantuml-check\.sh)$
      - id: repocheck-diagrams
        name: repocheck (図の描き直し漏れ)
        entry: go run ./scripts/repocheck diagrams
        language: unsupported
        pass_filenames: false
        always_run: true
      # 状態機械図の網羅。script は sud-design skill から vendor した版 (版は scripts/check-statechart.py の commit で固定)
      - id: check-statechart
        name: check-statechart (状態機械図の網羅)
        entry: python3 -I scripts/check-statechart.py docs/design/statechart.puml
        language: unsupported
        pass_filenames: false
        files: ^(docs/design/statechart\.puml|scripts/check-statechart\.py)$
      # binary は CI と同じ版を人が公式の手段で入れる (CONTRIBUTING.md の「セットアップ」)。公式の hook は
      # language: golang で source から build し (公式が保証しない導入経路)、--fix も付くので使わない。
      # script は手元の版が checks.yml の lint job の version: と違えば lint を撃たずに落とす
      - id: golangci-lint
        name: golangci-lint
        entry: scripts/golangci-lint.sh
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: go-test
        name: go test
        entry: go test -race ./...
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
