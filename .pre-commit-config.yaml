# `pre-commit install` 1 回で commit 時 (gitleaks) と push 前 (go vet / go test) の両方の hook が入る
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
