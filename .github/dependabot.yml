# 依存の版を週 1 回、ecosystem ごとに 1 本の PR で上げる。auto-merge はしない (PR の CI を人が見て merge する)。
# 対象外で手で上げるもの (goreleaser の version・CI の pre-commit の版・go.mod の toolchain) は CONTRIBUTING.md の「gate」
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ["*"]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns: ["*"]
