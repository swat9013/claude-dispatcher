# PR と main への push で、検査の本体 (checks.yml) を撃つ。gate の方針は CONTRIBUTING.md の「gate」
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR に push が重なったら古い run を中止する。main への push は run ごとに別の group にし、中止しない
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
