# PR と main への push で、push 前の gate (go vet / go test) を配布対象の OS (linux / darwin) の runner で撃ち、
# .goreleaser.yaml を検査する。release.yml も publish の前段としてこの workflow を呼ぶ (gate を 1 箇所に置く)。
# gate の方針は CONTRIBUTING.md の「gate」
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # -v で skip の理由 (runner に在る実物に届くので検査が成り立たないケース) を log に残す
      # shell: bash は pipefail で撃つので、go test が落ちれば tee を挟んでも step は落ちる
      - run: go test -count=1 -v ./... 2>&1 | tee test.log
        shell: bash
      # skip の理由 (t.Skipf の文) は --- SKIP の行の直前に出るので、1 行前も並べる
      - name: skip したテスト
        if: always()
        run: grep -B1 -- '--- SKIP' test.log || echo "skip なし"
        shell: bash

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: check
