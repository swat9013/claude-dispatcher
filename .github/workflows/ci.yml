# PR と main への push で、push 前の gate (go vet / go test) を配布対象の OS (linux / darwin) の runner で撃ち、
# .goreleaser.yaml を検査する。release.yml も publish の前段としてこの workflow を呼ぶ (gate を 1 箇所に置く)。
# gate の方針は CONTRIBUTING.md の「gate」
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # -json の event を残し、log には -v と同じ出力を流す。shell: bash は pipefail で撃つので、go test が落ちれば step も落ちる
      - run: go test -count=1 -json ./... | tee test.json | jq -rj 'select(.Action == "output") | .Output'
        shell: bash
      # skip したテストと理由 (t.Skipf の文) を並べる。subtest の --- SKIP は親の結果の下にまとめて出て、
      # 理由の行と離れるので、-v の行の位置でなく -json の event をテスト名で引く
      - name: skip したテスト
        if: always()
        run: |
          jq -rs '
            [.[] | select(.Action == "skip" and .Test) | {Package, Test}] as $skipped
            | if ($skipped | length) == 0 then "skip なし"
              else .[] | select(.Action == "output" and .Test and ({Package, Test} | IN($skipped[]))
                                and (.Output | test("^\\s+\\S+\\.go:\\d+: ")))
                   | "\(.Test):\(.Output | rtrimstr("\n"))"
              end' test.json
        shell: bash

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: check
