# `v*` の tag を push すると、GoReleaser で GitHub Releases に binary を出す。
# テストは push 前の gate (CONTRIBUTING.md) が担う。black-box テストは依存 CLI の解決を PATH の実物に左右されるので
# (runner の /usr/bin/gh 等)、Linux の runner で通ることを確かめるまで release の gate にしない
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
