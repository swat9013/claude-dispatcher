# `v*` の tag を push すると、GoReleaser で GitHub Releases に binary を出す。gate の方針は CONTRIBUTING.md の「release」
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # release の書き込み権限を持つ job なので、action は commit SHA で固定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # push 前の gate を通った main の commit にだけ release を出す (tag を main の外の commit に打ったら止める)
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: go vet ./...
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tap `swat9013/homebrew-tap` の cask を更新する token (.goreleaser.yaml の homebrew_casks)
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
