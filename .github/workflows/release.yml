# `v*` の tag を push すると、GoReleaser で GitHub Releases に binary を出し、tap の cask を更新する。gate と token の方針は CONTRIBUTING.md の「release」
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # push 前の gate を通った main の commit にだけ release を出す (tag を main の外の commit に打ったら、gate を走らせる前に止める)
  on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  # CI と同じ検査の本体 (checks.yml) を tag の commit で通してから publish する
  gate:
    needs: on-main
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  release:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      # release の書き込み権限を持つ job なので、action は commit SHA で固定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Releases に binary を出した後の tap への push で落ちて release が半端に止まるのを、publish の前に止める (未登録と失効)
      - name: tap の token が使えるか確かめる
        run: |
          test -n "$GH_TOKEN" || { echo "::error::secret HOMEBREW_TAP_GITHUB_TOKEN が未登録 (CONTRIBUTING.md の「release」)"; exit 1; }
          gh api repos/swat9013/homebrew-tap --silent || { echo "::error::secret HOMEBREW_TAP_GITHUB_TOKEN で tap repo を読めない。失効していれば発行し直す (CONTRIBUTING.md の「release」)"; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          install-only: true
      # 壊れた cask を tap へ publish するのを止める。.goreleaser.yaml の custom_block の template escape が崩れると、
      # Homebrew が install 時に展開する {{staged_path}} が literal で残らない
      - name: 生成される cask に literal の {{staged_path}} が残るか確かめる
        run: |
          goreleaser release --snapshot --clean
          grep -qF '{{staged_path}}' dist/homebrew/Casks/*.rb || { echo "::error::.goreleaser.yaml の custom_block の template escape が崩れ、cask に {{staged_path}} が残っていない"; exit 1; }
      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
